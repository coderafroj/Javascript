<script>
    class Coderafroj{
        constructor(name,add,phone){
            this.name=name
            this.add=add
            this.phone=phone
            console.log("constructer called");
            this.role="coderafroj"
        }
        show(text){
            let p=document.createElement("p")
            let div=document.createElement("div")
            div.classList.add("box")
            let id=document.createElement("span")
            let h1=document.createElement("h1")
            let h2=document.createElement("h2")
            let h3=document.createElement("h3")
            id.textContent=`id  : ${Date.now()}`
            h1.textContent=`Name    :   ${this.name}`
            h2.textContent=`Address :   ${this.add}`
            h3.textContent=`phone   :   ${this.phone}`
        
            p.textContent=`${this.name}  ${text}`
            
           div.appendChild(p)
            div.appendChild(id)
            div.appendChild(h1)
             div.appendChild(h2)
              div.appendChild(h3)
               document.body.append(div)

            


            
            

        }
        
     }
     class Admin extends Coderafroj{
        constructor(name,add,phone){
            super(name,add,phone)
            this.role="admin"

        }
     }
