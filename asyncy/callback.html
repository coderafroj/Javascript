<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>callback</title>
</head>
<body>

</body>
<script>
    function showData(name,cp){
        console.log("fetching user.",name,"...");
        
        setTimeout(()=>{
            console.log("hey how are you!!",name);
            
            cp({name,age:12,city:"bareilly",id:1729})
        },3000)
    }
function posts(id,cb){
    console.log('loading post..');
    
    setTimeout(()=>{
        cb({id:id,posts:["hey",'hi']})
    },5000)
}
    showData('coderafroj',function(data){
        console.log(data);
        
        posts(data.id,function(post){
            console.log(post)

        })
    })
</script>
</html>
